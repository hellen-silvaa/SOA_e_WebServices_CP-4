spring.application.name=AutoEscola3ESR

server.port=${SERVER_PORT:8081}

# Segredos vêm de variáveis de ambiente (ou de um arquivo .env não versionado).
# Os valores após ":" são defaults só para desenvolvimento local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3esr}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:fiap}

api.security.token.secret=${JWT_SECRET:dev-only-secret-troque-em-producao-min-32-chars}
